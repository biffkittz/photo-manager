# Infrastructure: plan on pull requests (read-only identity), apply on main behind the "production"
# environment (configure required reviewers on it). Azure access is keyless (OIDC federation).
# Third-party credentials follow the same split: pull-request plans get read-only Cloudflare/Temporal Cloud
# credentials (repository secrets); the write-capable ones are secrets of the "production" environment and
# are released only to the approved apply job.
name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra/environments/prod

jobs:
  plan:
    # Pull requests from forks never receive OIDC tokens or secrets. Dependabot pull requests do not get the
    # repository secrets either; for those, the CI workflow's fmt/validate is the check.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
      TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY_READONLY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Variables (from a repository variable; nothing in it is secret)
        env:
          TFVARS: ${{ vars.TF_VARS_PROD }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars
      # The backend (existing state storage, Entra ID auth) is configured in versions.tf.
      - run: terraform init -input=false
      # -lock=false: the plan identity can only read the state, so code under review can never modify it.
      # (Runs are serialized by the workflow's concurrency group.)
      - run: terraform plan -input=false -lock=false -no-color | tee plan.txt
      - name: Plan summary
        if: always()
        run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes|Error)' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Variables
        env:
          TFVARS: ${{ vars.TF_VARS_PROD }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - run: terraform apply -input=false tfplan
