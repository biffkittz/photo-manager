# Weekly dependency updates, grouped to keep the PR count manageable. Security updates are opened
# immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /app/backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/environments/prod]
    schedule:
      interval: weekly
